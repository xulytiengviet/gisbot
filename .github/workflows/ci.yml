name: GISBot CI
on:
  push:
    branches: [main, pages]
  pull_request:
    branches: [main, pages]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
