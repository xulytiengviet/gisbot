# GISBot — production deployment to the EXISTING Cloudflare Workers service.
name = "gisbot"
main = "./src/worker.js"
compatibility_date = "2026-09-26"
workers_dev = true
send_metrics = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
